name: Build Pygame for macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # Passo 1: Descarregar o repositório
    - name: Checkout repository
      uses: actions/checkout@v4

    # Passo 2: Configurar o ambiente com Python 3.13
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # Passo 3: Instalar as dependências do SDL via Homebrew
    - name: Install SDL Dependencies
      run: |
        brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf pkg-config portmidi

    # Passo 4: Instalar as dependências do Python
    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller

    # Passo 5: Compilar a aplicação com o PyInstaller (Sem ícone)
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed \
          --name="SpaceInvadersOMV" \
          space_invaders.py

    # Passo 6: Compactar a app num ficheiro ZIP para preservar permissões do Mac
    - name: Compress App Bundle
      run: |
        cd dist
        zip -r ../SpaceInvadersOMV-macOS.zip SpaceInvadersOMV.app

    # Passo 7: Upload do ficheiro final para o GitHub Artifacts
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: space-invaders-macos-build
        path: SpaceInvadersOMV-macOS.zip

