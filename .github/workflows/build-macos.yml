name: Build Pygame for macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # Passo 1: Descarregar o repositório
    - name: Checkout repository
      uses: actions/checkout@v4

    # Passo 2: Configurar o ambiente Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Passo 3: Instalar as dependências do SDL via Homebrew
    - name: Install SDL Dependencies
      run: |
        brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf pkg-config portmidi

    # Passo 4: Instalar as dependências do Python
    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller pillow

    # Passo 5: Converter o teu icon.png para o formato nativo do macOS (.icns)
    - name: Convert PNG to ICNS
      run: |
        mkdir icon.iconset
        sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
        sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
        sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
        sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
        sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
        sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
        sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
        sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
        sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
        sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
        iconutil -c icns icon.iconset
        rm -R icon.iconset

    # Passo 6: Compilar a aplicação com o PyInstaller apontando para o space_invaders.py
    # O '--add-data' garante que o icon.png é copiado para dentro do pacote final da app
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed \
          --name="SpaceInvadersOMV" \
          --icon="icon.icns" \
          --add-data="icon.png:." \
          space_invaders.py

    # Passo 7: Compactar a app num ficheiro ZIP para preservar permissões do Mac
    - name: Compress App Bundle
      run: |
        cd dist
        zip -r ../SpaceInvadersOMV-macOS.zip SpaceInvadersOMV.app

    # Passo 8: Upload do ficheiro final para o GitHub
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: space-invaders-macos-build
        path: SpaceInvadersOMV-macOS.zip
